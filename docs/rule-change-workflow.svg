<text x="955.0" y="406.0" text-anchor="middle" font-size="15" fill="#111827">Verify: Lint, Typecheck,</text>
<text x="955.0" y="424.0" text-anchor="middle" font-size="15" fill="#111827">Boundaries, Test</text>
<rect x="580" y="372" width="210" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
<text x="685.0" y="406.0" text-anchor="middle" font-size="15" fill="#111827">A different person</text>
<text x="685.0" y="424.0" text-anchor="middle" font-size="15" fill="#111827">approves the pull request</text>
<rect x="310" y="372" width="210" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="415.0" y="415.0" text-anchor="middle" font-size="15" fill="#111827">Live</text>
<rect x="310" y="518" width="210" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
<text x="415.0" y="552.0" text-anchor="middle" font-size="15" fill="#111827">Admin switches it off</text>
<text x="415.0" y="570.0" text-anchor="middle" font-size="15" fill="#111827">in seconds</text>
