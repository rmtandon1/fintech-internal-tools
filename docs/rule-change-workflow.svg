<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect width="1100" height="760" fill="#ffffff"/>
<text x="550.0" y="44" text-anchor="middle" font-size="24" font-weight="600" fill="#111827">How work reaches the console</text>
<rect x="40" y="80" width="210" height="76" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="145.0" y="104.0" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">A rule</text>
<text x="145.0" y="121.0" text-anchor="middle" font-size="11" fill="#4b5563">Refunds cluster drawer</text>
<text x="145.0" y="135.0" text-anchor="middle" font-size="11" fill="#4b5563">Ask Devin for a rule</text>
<rect x="40" y="226" width="210" height="76" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="145.0" y="250.0" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">A manual step</text>
