<text x="415.0" y="114.0" text-anchor="middle" font-size="15" fill="#111827">Ask from the screen</text>
<text x="415.0" y="132.0" text-anchor="middle" font-size="15" fill="#111827">that shows the need</text>
<rect x="580" y="80" width="210" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
