<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect x="20" y="30" width="250" height="132" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="44" cy="54" r="13" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="44" y="59.2" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">1</text>
<text x="145.0" y="90.0" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Your team asks</text>
<text x="145.0" y="121.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">One sentence, from the</text>
<text x="145.0" y="141.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">screen that shows the need</text>
<path d="M 276 96.0 L 332 96.0" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="340" y="30" width="250" height="132" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="364" cy="54" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="364" y="59.2" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">2</text>
<text x="465.0" y="90.0" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Devin builds</text>
<text x="465.0" y="121.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Plan committed first,</text>
<text x="465.0" y="141.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">then code, tests and CI</text>
<path d="M 596 96.0 L 652 96.0" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="660" y="30" width="250" height="132" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="684" cy="54" r="13" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="684" y="59.2" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">3</text>
<text x="785.0" y="90.0" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">An engineer approves</text>
<text x="785.0" y="121.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">A different person.</text>
<text x="785.0" y="141.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Devin merges only after</text>
<path d="M 916 96.0 L 972 96.0" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="980" y="30" width="250" height="132" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<circle cx="1004" cy="54" r="13" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="1004" y="59.2" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">4</text>
<text x="1105.0" y="90.0" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">An admin turns it on</text>
<text x="1105.0" y="121.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Merged isn't live.</text>
<text x="1105.0" y="141.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Off again in seconds</text>
<path d="M 1105.0 168 L 1105.0 214 L 145.0 214 L 145.0 172" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="625.0" y="199.2" text-anchor="middle" font-size="16" font-weight="400" fill="#4b5563" font-style="italic">the next request runs the same loop</text>
<text x="20" y="279.1" text-anchor="start" font-size="18" font-weight="700" fill="#111827">Three times today, each change bigger than the last</text>
<rect x="20" y="298" width="340" height="112" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="190.0" y="332.1" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Part 1 · A rule</text>
<text x="190.0" y="363.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Kestrel refund hold: added,</text>
<text x="190.0" y="383.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">switched off, then removed</text>
<rect x="380" y="298" width="390" height="112" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="575.0" y="332.1" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Part 2 · A connector</text>
<text x="575.0" y="363.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">A Companies House lookup</text>
<text x="575.0" y="383.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">replaces a check typed by hand</text>
<rect x="790" y="298" width="440" height="112" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="1010.0" y="332.1" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Part 3 · An app</text>
<text x="1010.0" y="363.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">Chargebacks leaves Power Apps</text>
<text x="1010.0" y="383.2" text-anchor="middle" font-size="16" font-weight="400" fill="#374151">as a first pull request, switched off</text>
<text x="20" y="451.2" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">Every step writes a row to one audit log.</text>
<rect x="780" y="438" width="30" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
<text x="820" y="452.2" text-anchor="start" font-size="16" font-weight="400" fill="#374151">Human gate</text>
<rect x="930" y="438" width="30" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="970" y="452.2" text-anchor="start" font-size="16" font-weight="400" fill="#374151">Devin</text>
<rect x="1030" y="438" width="30" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1070" y="452.2" text-anchor="start" font-size="16" font-weight="400" fill="#374151">Live</text>
</svg>
